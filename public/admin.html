<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调查管理</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/admin.css">
    <script type="module" src="/theme.js"></script>
    <script type="module" src="/admin.js"></script>
  </head>
  <body>
    <button
      type="button"
      class="theme-toggle"
      data-theme-toggle
      aria-label="切换主题"
      title="切换主题"
    >
      <span class="theme-icon" aria-hidden="true"></span>
    </button>
    <main>
      <section id="login-view" class="home-shell" aria-labelledby="login-heading" hidden>
        <div class="home-primary">
          <div class="home-primary-inner">
            <section class="panel login-panel">
              <p class="eyebrow">Cloudflare 调查</p>
              <h1 id="login-heading">管理员登录</h1>
              <form id="login-form">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">登录</button>
              </form>
              <p id="login-status" class="status" role="status" aria-live="polite"></p>
            </section>
            <a class="back-link" href="/">返回主页</a>
          </div>
        </div>
        <aside class="home-aside" aria-labelledby="login-aside-heading">
          <div class="home-aside-content">
            <span class="home-aside-mark" aria-hidden="true">“</span>
            <p class="home-aside-kicker">管理您的问卷</p>
            <h2 id="login-aside-heading">创建、复制、查看与导出，一处完成。</h2>
            <p>登录后可管理问卷与答卷；客户填写流程不受影响。</p>
          </div>
        </aside>
      </section>

      <section id="admin-view" class="shell" hidden>
        <header class="page-header">
          <div>
            <p class="eyebrow">Cloudflare 调查</p>
            <h1>问卷管理</h1>
            <p class="subtle">上传 CSV 文件或手工创建新问卷。</p>
          </div>
          <button id="logout-button" class="secondary" type="button">退出登录</button>
        </header>

        <div class="workspace">
          <section class="panel" aria-labelledby="upload-heading">
            <h2 id="upload-heading">上传 CSV</h2>
            <form id="upload-form">
              <label for="csv-file">问卷 CSV 文件</label>
              <input id="csv-file" name="file" type="file" accept=".csv,text/csv" required>
              <p class="hint">文件最大为 256 KiB，文件名将作为问卷标题。</p>
              <button type="submit">上传问卷</button>
            </form>
            <p id="upload-status" class="status" role="status" aria-live="polite"></p>
          </section>

          <section class="panel editor-panel" aria-labelledby="editor-heading">
            <div class="section-heading">
              <div>
                <h2 id="editor-heading">创建问卷</h2>
                <p class="hint">在题目卡片上点击“添加题目”即可在该题后插入新题；题目 ID 由系统自动生成。每份问卷最多 200 道题。</p>
              </div>
              <div class="section-actions">
                <button id="cancel-editor-button" class="secondary" type="button" hidden>取消</button>
              </div>
            </div>
            <p id="editor-mode-banner" class="mode-banner" role="status" hidden></p>
            <form id="editor-form">
              <label for="survey-title">问卷标题</label>
              <input id="survey-title" name="title" maxlength="251" required>
              <div id="questions" class="questions"></div>
              <button id="save-button" type="submit">创建问卷</button>
            </form>
            <p id="editor-status" class="status" role="status" aria-live="polite"></p>
          </section>
        </div>

        <section class="panel list-panel" aria-labelledby="list-heading">
          <div class="section-heading">
            <h2 id="list-heading">已保存的问卷</h2>
            <button id="refresh-button" class="secondary" type="button">刷新</button>
          </div>
          <p id="list-status" class="status" role="status" aria-live="polite">正在加载问卷……</p>
          <div class="table-wrap">
            <table id="survey-table" hidden>
              <thead>
                <tr>
                  <th scope="col">标题</th>
                  <th scope="col">问卷 ID</th>
                  <th scope="col">创建时间</th>
                  <th scope="col">操作</th>
                </tr>
              </thead>
              <tbody id="survey-list"></tbody>
            </table>
          </div>
          <button id="load-more-button" class="secondary" type="button" hidden>加载更多</button>
        </section>

        <section id="questionnaire-detail-panel" class="panel list-panel" aria-labelledby="questionnaire-detail-heading" hidden>
          <div class="section-heading">
            <div>
              <h2 id="questionnaire-detail-heading">问卷详情</h2>
              <p id="questionnaire-detail-subtitle" class="hint"></p>
            </div>
            <button id="close-detail-button" class="secondary" type="button">关闭</button>
          </div>
          <p id="questionnaire-detail-status" class="status" role="status" aria-live="polite"></p>
          <ol id="questionnaire-detail-list" class="questionnaire-detail-list"></ol>
        </section>
      </section>
    </main>

    <template id="question-template">
      <fieldset class="question-card">
        <legend>题目 <span class="question-number"></span></legend>
        <div class="question-actions">
          <button class="move-up secondary compact" type="button" aria-label="上移题目">上移</button>
          <button class="move-down secondary compact" type="button" aria-label="下移题目">下移</button>
          <button class="add-after secondary compact" type="button" aria-label="在此题目后添加新题目">添加题目</button>
          <button class="remove danger compact" type="button">删除</button>
        </div>
        <div class="question-grid">
          <label>
            题型
            <select class="question-type" required>
              <option value="text">单行文本</option>
              <option value="textarea">多行文本</option>
              <option value="email">Email</option>
              <option value="number">数字</option>
              <option value="single_choice">单选</option>
              <option value="multi_choice">多选</option>
            </select>
          </label>
          <label class="wide">
            题目文字
            <textarea class="question-label" maxlength="1000" rows="2" required></textarea>
          </label>
          <label class="checkbox-label">
            <input class="question-required" type="checkbox">
            必填
          </label>
          <label class="wide options-label" hidden>
            选项（使用 | 分隔）
            <input class="question-options" maxlength="4000" placeholder="选项一|选项二">
          </label>
        </div>
      </fieldset>
    </template>
  </body>
</html>
