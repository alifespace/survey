<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择调查问卷</title>
    <link rel="stylesheet" href="/customer.css">
    <script type="module" src="/customer.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <p class="eyebrow">Cloudflare 调查</p>
        <h1>选择一份调查问卷</h1>
        <p>输入你的 Email，然后选择要填写的问卷。</p>
      </section>

      <section class="panel" aria-labelledby="entry-heading">
        <h2 id="entry-heading">开始填写</h2>
        <form id="entry-form" novalidate>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            maxlength="254"
            autocomplete="email"
            inputmode="email"
            placeholder="name@example.com"
            required
          >
          <p id="email-error" class="field-error" aria-live="polite"></p>

          <fieldset id="survey-fieldset" hidden>
            <legend>可用问卷</legend>
            <div id="survey-list" class="survey-list"></div>
          </fieldset>

          <p id="list-status" class="status" role="status" aria-live="polite">正在加载问卷……</p>
          <button id="retry-button" class="secondary" type="button" hidden>重新加载</button>
          <button id="continue-button" type="submit" disabled>继续</button>
        </form>
      </section>

      <a class="admin-link" href="/admin.html">管理员登录</a>
    </main>
  </body>
</html>
